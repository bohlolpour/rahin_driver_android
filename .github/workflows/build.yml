name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./rahin_driver  # 👈 اگر اسم پوشه پروژه چیز دیگری است، اینجا تغییر دهید
        
      - name: Build APK
        run: flutter build apk --release
        working-directory: ./rahin_driver  # 👈 اگر اسم پوشه پروژه چیز دیگری است، اینجا تغییر دهید
        
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./rahin_driver/build/app/outputs/flutter-apk/app-release.apk # 👈 اگر اسم پوشه پروژه چیز دیگری است، اینجا تغییر دهید
