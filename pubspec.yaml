name: rahin_driver
description: "RAHIN Driver Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  shamsi_date: ^1.0.0
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_cancellable_tile_provider: ^3.0.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.3
  audioplayers: ^6.1.0
  vibration: ^2.0.0
  dio: ^5.7.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/offer_alert.mp3
    - assets/sounds/notification.mp3
    - assets/images/logo_rahin.png # این خط را چک کنید

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700